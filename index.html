<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="DILS — One Brand. Three Fits." />
  <title>DILS — One Brand. Three Fits.</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;500;600;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --black: #040404;
      --off-white: #f0ede8;
      --blue: #1a4fff;
      --blue-light: #4d79ff;
      --gold: #c9a84c;
      --gold-light: #e2c97e;
      --mid: #111111;
      --mid2: #0d0d0d;
      --border: rgba(255,255,255,0.07);
      --border-gold: rgba(201,168,76,0.2);
      --green: #25D366;
      --ecocash: #F47920;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--black);
      color: var(--off-white);
      font-family: 'Barlow Condensed', sans-serif;
      overflow-x: hidden;
      line-height: 1.4;
    }
    img, video { max-width: 100%; display: block; }
    a { color: inherit; }

    .container {
      width: min(1200px, calc(100% - 48px));
      margin-inline: auto;
    }

    /* Navigation */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 48px;
      background: rgba(4, 4, 4, 0.92);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo { display: inline-flex; align-items: center; }
    .nav-logo img { height: 32px; width: auto; }
    .nav-links {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 32px;
    }
    .nav-links a {
      font-family: 'Space Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(240,237,232,0.45);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--off-white); }
    .nav-btn {
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: var(--black) !important;
      padding: 9px 20px;
      font-weight: 700;
      display: inline-block;
    }
    .nav-insta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: rgba(240,237,232,0.5) !important;
    }
    .nav-insta svg { width: 13px; height: 13px; fill: currentColor; }
    .nav-toggle { display: none; }
    .nav-overlay { display: none; }

    /* Buttons */
    .btn,
    .btn-gold,
    .btn-ghost {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 14px 30px;
      border: none;
      cursor: pointer;
      font-family: 'Space Mono', monospace;
      font-size: 0.58rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }
    .btn-gold,
    .btn-primary {
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: var(--black);
      box-shadow: 0 10px 30px rgba(201,168,76,0.2);
    }
    .btn-ghost {
      background: transparent;
      color: var(--off-white);
      border: 1px solid rgba(240,237,232,0.18);
    }
    .btn-gold:hover, .btn-ghost:hover { transform: translateY(-2px); }
    .btn-ghost:hover { border-color: var(--gold); color: var(--gold); }

    /* Hero */
    #hero {
      position: relative;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 55% 45%;
      overflow: hidden;
      background: var(--black);
    }
    .hero-left {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 100px 48px 90px;
      background: linear-gradient(to right, var(--black) 58%, transparent 100%);
    }
    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
      font-family: 'Space Mono', monospace;
      font-size: 0.54rem;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--gold);
    }
    .hero-eyebrow::before {
      content: '';
      display: inline-block;
      width: 28px;
      height: 1px;
      background: var(--gold);
    }
    .hero-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(4rem, 9vw, 10rem);
      line-height: 0.88;
      letter-spacing: 3px;
    }
    .hero-title .accent { color: var(--blue); }
    .hero-title .gld { color: var(--gold); }
    .hero-divider {
      width: 52px;
      height: 1px;
      margin: 26px 0;
      background: linear-gradient(to right, var(--gold), transparent);
    }
    .hero-sub {
      max-width: 380px;
      font-size: 1rem;
      font-weight: 300;
      letter-spacing: 1.5px;
      color: rgba(240,237,232,0.6);
      line-height: 1.7;
    }
    .hero-cta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 38px;
    }
    .hero-stats {
      position: absolute;
      left: 48px;
      bottom: 56px;
      display: flex;
      gap: 44px;
    }
    .stat { display: flex; flex-direction: column; gap: 4px; }
    .stat-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      letter-spacing: 2px;
      color: var(--gold);
      line-height: 1;
    }
    .stat-label {
      font-family: 'Space Mono', monospace;
      font-size: 0.46rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(240,237,232,0.32);
    }

    .hero-right {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      background: #0d0d0d;
    }
    .hero-right video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    .hero-right video.active { opacity: 1; }
    .hero-right::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, var(--black) 0%, transparent 30%), linear-gradient(to top, var(--black) 0%, transparent 20%);
    }
    .hero-ticker {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 36px;
      overflow: hidden;
      background: rgba(201,168,76,0.07);
      border-top: 1px solid var(--border-gold);
      display: flex;
      align-items: center;
    }
    .ticker-inner {
      display: flex;
      gap: 52px;
      white-space: nowrap;
      min-width: max-content;
      animation: ticker 28s linear infinite;
      font-family: 'Space Mono', monospace;
      font-size: 0.52rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(201,168,76,0.6);
      padding-left: 12px;
    }
    @keyframes ticker {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    /* Section headers */
    .section-eyebrow {
      font-family: 'Space Mono', monospace;
      font-size: 0.53rem;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }
    .section-eyebrow::before {
      content: '';
      display: inline-block;
      width: 22px;
      height: 1px;
      background: var(--gold);
    }
    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.8rem, 5vw, 5rem);
      line-height: 0.92;
      letter-spacing: 2px;
    }

    /* Journey */
    #journey { padding-top: 120px; }
    .journey-header {
      text-align: center;
      padding: 0 48px 72px;
    }
    .journey-header .section-eyebrow { justify-content: center; }
    .journey-header .section-eyebrow::before { display: none; }
    .journey-header .section-title { font-size: clamp(3.6rem, 8vw, 9rem); }
    .journey-header p:last-child {
      margin-top: 18px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.05rem;
      font-style: italic;
      color: rgba(240,237,232,0.38);
    }
    .journey-grid {
      display: grid;
      gap: 28px;
      padding: 0 0 50px;
    }
    .journey-stage {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 560px;
      background: var(--mid);
      overflow: hidden;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .journey-stage.reverse { direction: rtl; }
    .journey-stage.reverse > * { direction: ltr; }
    .stage-visual {
      position: relative;
      min-height: 300px;
      overflow: hidden;
      background: #0d0d0d;
    }
    .stage-visual img, .stage-visual video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .stage-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 58px 60px;
    }
    .stage-level {
      font-family: 'Space Mono', monospace;
      font-size: 0.52rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .stage-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.5rem, 5vw, 6rem);
      line-height: 0.88;
      margin-bottom: 8px;
    }
    .stage-collection {
      font-family: 'Barlow Condensed', sans-serif;
      font-style: italic;
      font-size: 0.95rem;
      opacity: 0.7;
      margin-bottom: 28px;
    }
    .stage-quote {
      position: relative;
      padding-left: 18px;
      margin-bottom: 30px;
      font-size: 1.2rem;
      font-weight: 300;
      color: rgba(240,237,232,0.7);
      letter-spacing: 0.5px;
    }
    .stage-quote::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: currentColor;
      opacity: 0.9;
    }
    .stage-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 34px;
    }
    .stage-tag {
      font-family: 'Space Mono', monospace;
      font-size: 0.48rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 6px 12px;
      border: 1px solid rgba(240,237,232,0.12);
      color: rgba(240,237,232,0.5);
    }
    .hustle .stage-level, .hustle .stage-name { color: #ff3e3e; }
    .hustle .stage-quote { color: rgba(255,62,62,0.8); }
    .grind .stage-level, .grind .stage-name { color: var(--blue-light); }
    .grind .stage-quote { color: rgba(77,121,255,0.8); }
    .success .stage-level, .success .stage-name { color: var(--gold); }
    .success .stage-quote { color: rgba(201,168,76,0.9); }

    /* Brand reveal */
    #reveal {
      position: relative;
      overflow: hidden;
      background: var(--black);
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 110px 24px;
    }
    #reveal::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 50% at 50% 50%, rgba(201,168,76,0.05), transparent);
    }
    .reveal-lines {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 42px;
    }
    .reveal-line {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(1.7rem, 4vw, 4rem);
      letter-spacing: 14px;
      color: rgba(240,237,232,0.14);
      opacity: 0;
      transform: translateY(18px);
      transition: all 0.9s ease;
    }
    .reveal-line.active { opacity: 1; transform: translateY(0); }
    .reveal-line:nth-child(1).active { color: #ff3e3e; }
    .reveal-line:nth-child(2).active { color: var(--blue-light); }
    .reveal-line:nth-child(3).active { color: var(--gold); }
    .reveal-dils {
      position: relative;
      z-index: 1;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(5rem, 15vw, 16rem);
      letter-spacing: 20px;
      line-height: 0.85;
      background: linear-gradient(135deg, #ff3e3e 0%, var(--blue) 45%, var(--gold) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      opacity: 0;
      transform: scale(0.9);
      transition: all 1.2s cubic-bezier(0.16,1,0.3,1);
    }
    .reveal-dils.active { opacity: 1; transform: scale(1); }
    .reveal-tagline {
      position: relative;
      z-index: 1;
      margin-top: 30px;
      font-family: 'Space Mono', monospace;
      font-size: 0.58rem;
      letter-spacing: 7px;
      color: rgba(240,237,232,0.22);
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 1s ease 0.6s;
    }
    .reveal-tagline.active { opacity: 1; }

    /* Sportswear */
    #sportswear-collection {
      background: var(--mid);
      position: relative;
      overflow: hidden;
      padding: 120px 0;
    }
    #sportswear-collection::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 100% 60% at 50% 0%, rgba(26,79,255,0.06), transparent);
    }
    .sport-header {
      position: relative;
      z-index: 1;
      width: min(1200px, calc(100% - 48px));
      margin: 0 auto 32px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
    }
    .sport-header-right {
      font-family: 'Space Mono', monospace;
      font-size: 0.52rem;
      letter-spacing: 3px;
      text-transform: uppercase;
